name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-dev pybind11-dev python3-pybind11

      - name: Install Python test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy pybind11
          python3 -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Configure Release
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run native CTest and Python binding tests
        run: ctest --test-dir build --output-on-failure --build-config Release
